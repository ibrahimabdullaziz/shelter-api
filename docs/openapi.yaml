openapi: 3.0.3
info:
  title: Shelter API
  description: OpenAPI specification for the Shelter rental marketplace backend.
  version: 1.0.0
  contact:
    name: Ibrahim Abdullaziz
    email: ibrahimabdullaziz55@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:2005
    description: Local development server

tags:
  - name: Auth
  - name: Catalog
  - name: Units
  - name: Bookings
  - name: Reviews
  - name: Favorites

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request payload or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required or invalid token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Action not allowed for the current role or ownership.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict or duplicate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Invalid credentials

    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - role
      properties:
        id:
          type: string
          format: uuid
          example: 7d08f7c4-9d6b-4e12-bfdf-0f8e0b6f0ee8
        email:
          type: string
          format: email
          example: guest@example.com
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        role:
          type: string
          enum: [GUEST, HOST, ADMIN]
          example: GUEST
        isVerified:
          type: boolean
          example: true

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: guest@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: StrongPass123
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: guest@example.com
        password:
          type: string
          format: password
          example: StrongPass123

    RefreshRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: Refresh token returned from login.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    VerifyEmailRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: guest@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: guest@example.com

    ResetPasswordRequest:
      type: object
      required:
        - email
        - code
        - password
      properties:
        email:
          type: string
          format: email
          example: guest@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          example: "123456"
        password:
          type: string
          format: password
          minLength: 8
          example: NewStrongPass123

    AuthTokens:
      type: object
      required:
        - accessToken
        - refreshToken
        - user
      properties:
        accessToken:
          type: string
          example: eyJhbGciOi...
        refreshToken:
          type: string
          example: eyJhbGciOi...
        user:
          $ref: "#/components/schemas/User"

    Country:
      type: object
      required:
        - id
        - name
        - code
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tunisia
        code:
          type: string
          example: TN

    City:
      type: object
      required:
        - id
        - name
        - countryId
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tunis
        countryId:
          type: string
          format: uuid

    Currency:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: TND
        name:
          type: string
          example: Tunisian Dinar

    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Apartment

    Unit:
      type: object
      required:
        - id
        - title
        - description
        - pricePerNight
        - maxGuests
        - cityId
        - categoryId
        - currencyId
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Cozy apartment in Tunis
        description:
          type: string
          example: Bright apartment near the old medina.
        pricePerNight:
          type: number
          format: float
          example: 120
        maxGuests:
          type: integer
          example: 4
        cityId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        currencyId:
          type: string
          format: uuid
        isActive:
          type: boolean
          example: true
        ownerId:
          type: string
          format: uuid

    UnitPhoto:
      type: object
      required:
        - id
        - url
        - publicId
        - unitId
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          example: https://res.cloudinary.com/demo/image/upload/v123/shelter/units/example.jpg
        publicId:
          type: string
          example: shelter/units/example
        unitId:
          type: string
          format: uuid

    Booking:
      type: object
      required:
        - id
        - unitId
        - guestId
        - checkIn
        - checkOut
        - totalPrice
        - status
      properties:
        id:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        guestId:
          type: string
          format: uuid
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        totalPrice:
          type: number
          format: float
          example: 480
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED]
          example: PENDING

    Review:
      type: object
      required:
        - id
        - unitId
        - guestId
        - rating
      properties:
        id:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        guestId:
          type: string
          format: uuid
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        comment:
          type: string
          example: Great stay and very clean apartment.

    Favorite:
      type: object
      required:
        - userId
        - unitId
      properties:
        userId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid

    ListResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: array
          items:
            type: object

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Starts a registration flow without revealing whether the email is already registered.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: guest@example.com
              password: StrongPass123
              firstName: Jane
              lastName: Doe
      responses:
        "202":
          description: Registration request accepted
          content:
            application/json:
              schema:
                type: object
                required: [status, message]
                properties:
                  status:
                    type: integer
                    example: 202
                  message:
                    type: string
                    example: If the address can be registered, check your email for next steps.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login a user
      description: Authenticate a user and return access and refresh tokens.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: guest@example.com
              password: StrongPass123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: User logged successfully
                  data:
                    $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            example:
              token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, accessToken]
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Token refreshed successfully
                  accessToken:
                    type: string
                    example: eyJhbGciOi...
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: Returns the currently authenticated user profile from the JWT payload.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: User retrieved successfully
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify user email
      description: Confirm a user email address using the 6-digit OTP code generated during signup.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
            example:
              email: guest@example.com
              code: "123456"
      responses:
        "200":
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Email verified successfully
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request password reset code
      description: Send a password reset OTP to the user's email.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
            example:
              email: guest@example.com
      responses:
        "200":
          description: Password reset code sent successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Password changed successfully
                  data:
                    type: object
                    nullable: true
                    example: null
        "404":
          $ref: "#/components/responses/NotFound"

  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      description: Reset a user's password using the email and verification code.
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
            example:
              email: guest@example.com
              code: "123456"
              password: NewStrongPass123
      responses:
        "200":
          description: Password updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Password changed successfully
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/countries:
    get:
      tags: [Catalog]
      summary: List countries
      operationId: getCountries
      security: []
      responses:
        "200":
          description: Countries fetched successfully
          content:
            application/json:
              schema:
                type: object
                required: [status, message, data]
                properties:
                  status:
                    type: string
                    example: "200"
                  message:
                    type: string
                    example: countries data fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Country"
    post:
      tags: [Catalog]
      summary: Create country
      operationId: createCountry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name:
                  type: string
                  example: Tunisia
                code:
                  type: string
                  example: TN
      responses:
        "200":
          description: Country created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "200"
                  message:
                    type: string
                    example: country created successfully
                  data:
                    $ref: "#/components/schemas/Country"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/cities:
    get:
      tags: [Catalog]
      summary: List cities
      operationId: getCities
      security: []
      responses:
        "200":
          description: Cities fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "200"
                  message:
                    type: string
                    example: cities data fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/City"
    post:
      tags: [Catalog]
      summary: Create city
      operationId: createCity
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, countryId]
              properties:
                name:
                  type: string
                  example: Tunis
                countryId:
                  type: string
                  format: uuid
                  example: 2ebf420c-47e6-4a8f-87d2-9072f2ffdd1c
      responses:
        "200":
          description: City created successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/currencies:
    get:
      tags: [Catalog]
      summary: List currencies
      operationId: getCurrencies
      security: []
      responses:
        "200":
          description: Currencies fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "200"
                  message:
                    type: string
                    example: currencies data fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Currency"

  /api/unit-categories:
    get:
      tags: [Catalog]
      summary: List categories
      operationId: getCategories
      security: []
      responses:
        "200":
          description: Categories fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "200"
                  message:
                    type: string
                    example: categories data fetched successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      tags: [Catalog]
      summary: Create category
      operationId: createCategory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Apartment
      responses:
        "200":
          description: Category created successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/units:
    get:
      tags: [Units]
      summary: List units
      description: List publicly available units with optional query filters.
      operationId: listUnits
      security: []
      parameters:
        - in: query
          name: cityId
          schema:
            type: string
            format: uuid
        - in: query
          name: categoryId
          schema:
            type: string
            format: uuid
        - in: query
          name: minPrice
          schema:
            type: number
            minimum: 0
        - in: query
          name: maxPrice
          schema:
            type: number
            minimum: 0
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Units listed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: units listed successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Units]
      summary: Create a unit
      operationId: createUnit
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unit"
            example:
              title: Cozy apartment in Tunis
              description: Bright apartment near the old medina.
              pricePerNight: 120
              maxGuests: 4
              cityId: 2ebf420c-47e6-4a8f-87d2-9072f2ffdd1c
              currencyId: 8243b73b-1c7f-4f5e-bd59-0d3ff9d533a6
              categoryId: d3e78fbd-b3ea-468d-a337-9b3d5f7d91e2
      responses:
        "201":
          description: Unit created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: unit created successfully
                  data:
                    $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/units/mine:
    get:
      tags: [Units]
      summary: List my units
      operationId: listMyUnits
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Units retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: units listed successfully
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Unit"

  /api/units/{id}:
    get:
      tags: [Units]
      summary: Get unit by id
      operationId: getUnitById
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unit fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: units fetched successfully
                  data:
                    $ref: "#/components/schemas/Unit"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Units]
      summary: Update unit
      operationId: updateUnit
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Unit"
      responses:
        "200":
          description: Unit updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Units]
      summary: Soft delete a unit
      operationId: softDeleteUnit
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unit deleted successfully

  /api/units/{id}/activate:
    patch:
      tags: [Units]
      summary: Activate a unit
      operationId: activateUnit
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unit activated successfully

  /api/units/{id}/deactivate:
    patch:
      tags: [Units]
      summary: Deactivate a unit
      operationId: deactivateUnit
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unit deactivated successfully

  /api/units/{unitId}/photos:
    post:
      tags: [Units]
      summary: Upload a unit photo
      operationId: uploadUnitPhoto
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: unitId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Photo uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: photo uploaded successfully
                  data:
                    $ref: "#/components/schemas/UnitPhoto"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
